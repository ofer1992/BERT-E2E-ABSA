[project]
name = "bert-e2e-absa"
version = "0.1.0"
description = "Exploiting BERT End-to-End Aspect-Based Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.7.0",
    "numpy>=1.19.0",
    "transformers>=4.1.1",
    "tqdm>=4.32.1",
    "tensorboardX>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
